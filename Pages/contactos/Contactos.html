<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
    <link rel="stylesheet" href="Contactos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Contactos</title>
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="../../Assets_proyect/Images_Proyect/Logos/DatyraLogo.jpeg" alt="Logo de DatyraStore" class="logo">
            <h1 class="site-name">DatyraStore</h1>
            <h2 class="site-tagline">Tecnología clara, decisiones inteligentes.</h2>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="../../productos/Productos.html">Productos</a></li>
                <li><a href="../../ofertas/Ofertas.html">Ofertas</a></li>
                <li><a href="../../contactos/Contactos.html">Contactos</a></li>
            </ul>
        </nav>
    </header>
<section class="contact-section">
  <div class="contact-container">
    
    <div class="contact-info">
      <h1></h1>
      <h2>¿Tienes preguntas? Te ayudaremos.</h2> <br>
      <p>Nuestro equipo responde rápido, Tus preguntas se resolveran en menos de un frame.</p>
      <br>
      <div class="info-item">
        <span>🕒</span> Lunes a Viernes - 8:00am a 6:00pm
      </div>

      <p class="response-time">Tiempo de respuesta estimado: 24 horas</p>
    </div>
    <a href="https://facebook.com/" target="_blank"><i></i></a>

    <div class="contact-form">
      <form>
        <input type="text" placeholder="Tu nombre" required>
        <input type="email" placeholder="Tu correo electrónico" required>
        <textarea placeholder="Escribe tu mensaje aquí..." required></textarea>
        <button type="submit">Enviar mensaje</button>
      </form>
    </div>

  </div>
</section>
</body>
</html>
